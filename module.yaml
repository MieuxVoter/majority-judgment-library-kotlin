# Configuration file for the Kotlin Toolchain.
# See https://kotlin-toolchain.org/
product:
  # This is a Kotlin MultiPlatform Library for Majority Judgment
  type: kmp/lib
  # Add/Enable platforms here as needed (but test them, first!)
  platforms:
    - jvm
    - android
    #- androidNativeX64
    #- androidNativeX86
    #- linuxX64
    #- linuxArm64
    #- androidNativeArm32
    #- androidNativeArm64
    #- iosX64
    #- iosArm64
    #- iosSimulatorArm64
    #- macosX64
    #- macosArm64
    #- tvosArm64
    #- tvosSimulatorArm64
    #- tvosX64
    #- watchosArm32
    #- watchosArm64
    #- watchosDeviceArm64
    #- watchosX64
    #- watchosSimulatorArm64
    #- mingwX64
    #- wasmJs
    #- wasmWasi

# I was very wary of adding *any* dependency to this library, but in the end it makes sense.
# We probably should not have any other dependency here than large number support, though.
dependencies:
  # We actually want Big Numbers support for two different reasons:
  # 1. Tally Normalization using the Least Common Multiple (LCM grows fast with primes) — perfect normalization
  # 2. Scalar Majority Merit (easily goes to ~60 decimal places) — it's useful for proportional representation
  # You can find more details about this in the README.
  - 'com.ionspin.kotlin:bignum:0.3.10':
      exported: true
      scope: all

test-dependencies:
  - $kotlin.test
  - $kotlin.test.junit5
  # This gets us the @ParameterizedTest goodies
  - 'org.junit.jupiter:junit-jupiter-params:5.1.0'

description: |
  A Kotlin Multiplatform library to efficiently rank candidates using Majority Judgment.
  Majority Judgment is an elegant voting system used in french wine contests, among other things.
  Its resolution does not require a computer, but it's still handy to be able to do it digitally.
  
  This library supports arbitrarily large amounts of voters — and millions of candidates.
  In addition to ranking, it also provides an extensive analysis of the merit profiles,
  including a scalar majority merit value that can be useful in a number of ways.
  
  For impeccable accuracy and reliability, this library does not use floating-point numbers.
  It also provides three utilities to balance your tallies, including a Least-Common-Multiple-based normalization.

settings:
  # https://kotlin-toolchain.org/dev/user-guide/publishing/
  # See our .env.publish.dist file.
  publishing:
    enabled: true
    group: fr.mieuxvoter
    # Acronym for 'Kotlin Majority Judgment' ; (mj is already taken by our pure java lib)
    artifactId: kmj

    # We have to keep this in sync with our git tags — by hand.  Sort of annoying.
    version: 0.4.1

    mavenCentral: enabled
    signArtifacts: true
    publishSources: true
    pom:
      url: https://mieuxvoter.fr
      scm: https://github.com/MieuxVoter/majority-judgment-library-kotlin.git
      developers:
        - name: MieuxVoter Devs
          email: dev@mieuxvoter.fr
          organization: MieuxVoter
          organizationUrl: https://mieuxvoter.fr
        - name: Dominique Merle
          email: dominique.merle.41@gmail.com
          url: https://discord.mieuxvoter.fr
          organization: MieuxVoter
          organizationUrl: https://mieuxvoter.fr
      licenses:
        - name: MIT
          url: https://opensource.org/license/mit
